server {
    listen 80;
    listen [::]:80;
    server_name invoice.soft-projects.io;

    # Root directory on VPS
    root /var/www/softprojects/invoice-helper;
    index index.php index.html;

    # Logs
    access_log /var/log/nginx/invoice.soft-projects.io.access.log;
    error_log /var/log/nginx/invoice.soft-projects.io.error.log;

    # Maximum payload size (PDFs, large catalogs)
    client_max_body_size 64M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Main routing
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP scripts to FastCGI server (PHP-FPM)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # Detect active PHP-FPM socket (php8.2-fpm / php8.3-fpm / php8.1-fpm / default)
        fastcgi_pass unix:/run/php/php-fpm.sock;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
        include fastcgi_params;
    }

    # Deny access to hidden files and internal storage catalogs directly if needed
    location ~ /\. {
        deny all;
    }

    location ^~ /storage/ {
        # Allow internal app access, deny direct listing
        internal;
    }
}
